name: Feature request
description: Propose a change to tech-radar.
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Background
      description: What problem would this solve? Include an example if you can.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workarounds
      description: How are you handling it today?
