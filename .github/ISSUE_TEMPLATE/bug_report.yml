name: Bug report
description: Report a bug in tech-radar.
body:
  - type: markdown
    attributes:
      value: Check existing issues first. For vulnerabilities, use [private security reporting](https://github.com/beardedeagle/tech-radar/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: Paste the output of tech-radar version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: macOS arm64, Linux amd64, or Windows amd64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and a small synthetic input when possible. Remove credentials, private code and customer data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead? Include relevant errors or output.
    validations:
      required: true
